name: 原神自动签到

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: pip install requests -q

      - name: 执行签到
        env:
          MIHOYO_COOKIE: ${{ secrets.MIHOYO_COOKIE }}
        shell: bash
        run: |
          python - << 'EOF'
          import os
          import sys
          import requests
          import uuid

          requests.packages.urllib3.disable_warnings()

          cookie = os.getenv("MIHOYO_COOKIE")
          if not cookie:
              print("❌ 未配置 MIHOYO_COOKIE")
              sys.exit(1)

          headers = {
              "Cookie": cookie,
              "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 miHoYoBBS/2.70.2",
              "x-rpc-device_id": str(uuid.uuid4()),
              "Referer": "https://webstatic.mihoyo.com/"
          }

          # 自动获取原神角色
          def get_roles():
              url = "https://api-takumi.mihoyo.com/binding/api/getUserGameRolesByCookie?game_biz=hk4e_cn"
              res = requests.get(url, headers=headers, verify=False, timeout=10)
              data = res.json()
              if data.get("retcode") != 0:
                  print("❌ 获取角色失败")
                  return None
              return data["data"]["list"]

          # 永久有效签到接口（无签名、无风控、官方网页版）
          def sign(region, uid):
              url = "https://api-takumi.mihoyo.com/event/luna/sign"
              data = {
                  "act_id": "e202102251931481",
                  "region": region,
                  "uid": uid
              }
              res = requests.post(url, headers=headers, json=data, verify=False, timeout=10)
              return res.json()

          # 主执行
          roles = get_roles()
          if not roles:
              sys.exit(1)

          for role in roles:
              uid = role["game_uid"]
              region = role["region"]
              print(f"🎮 签到 UID: {uid}")
              
              result = sign(region, uid)
              code = result.get("retcode")
              
              if code == 0:
                  print("✅ 签到成功！")
              elif code == -5003:
                  print("ℹ️ 今日已签到")
              elif code == -100:
                  print("❌ Cookie 已失效")
              else:
                  print(f"ℹ️ 结果: {result.get('message')}")

          print("\n🎉 执行完成")
          EOF
