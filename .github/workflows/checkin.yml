name: 原神米游社自动签到
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: pip install requests -q

      - name: 执行签到
        env:
          MIHOYO_COOKIE: ${{ secrets.MIHOYO_COOKIE }}
        run: |
          python - << 'EOF'
          import os
          import requests
          import uuid

          # 关闭警告
          requests.packages.urllib3.disable_warnings()

          # 获取Cookie
          cookie = os.getenv("MIHOYO_COOKIE")
          if not cookie:
              print("❌ 未配置 MIHOYO_COOKIE")
              exit(1)

          # 标准请求头（官方米游社，无报错）
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36",
              "Cookie": cookie,
              "x-rpc-device_id": str(uuid.uuid4()),
              "Referer": "https://webstatic.mihoyo.com/"
          }

          # 自动获取原神角色信息（官服/B服自动识别）
          def get_genshin_roles():
              try:
                  url = "https://api-takumi.mihoyo.com/binding/api/getUserGameRolesByCookie?game_biz=hk4e_cn"
                  resp = requests.get(url, headers=headers, verify=False, timeout=10)
                  data = resp.json()
                  if data.get("retcode") != 0:
                      return None
                  return data["data"]["list"]
              except:
                  return None

          # 原神官方签到接口（永久有效，领原石/树脂）
          def sign(region, uid):
              url = "https://api-takumi.mihoyo.com/event/luna/sign"
              json_data = {
                  "act_id": "e202102251931481",
                  "region": region,
                  "uid": uid
              }
              resp = requests.post(url, headers=headers, json=json_data, verify=False, timeout=10)
              return resp.json()

          # 主程序
          roles = get_genshin_roles()
          if not roles:
              print("❌ 获取角色失败，请检查Cookie是否有效")
              exit(1)

          for role in roles:
              uid = role["game_uid"]
              region = role["region"]
              nickname = role["nickname"]
              
              print(f"🎮 角色：{nickname} | UID：{uid}")
              result = sign(region, uid)
              code = result.get("retcode")

              if code == 0:
                  print("✅ 签到成功！奖励已发放")
              elif code == -5003:
                  print("ℹ️ 今日已签到，无需重复操作")
              elif code == -100:
                  print("❌ Cookie 已失效，请重新获取")
              else:
                  print(f"ℹ️ 提示：{result.get('message', '未知信息')}")

          print("\n🎉 签到流程全部完成")
          EOF
