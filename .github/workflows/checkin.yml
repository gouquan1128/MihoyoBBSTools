name: 原神自动签到
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装依赖
        run: pip install requests
      - name: 执行签到
        env:
          MIHOYO_COOKIE: ${{ secrets.MIHOYO_COOKIE }}
        shell: bash
        run: |
          python - << 'EOF'
          import os, sys, time, random, hashlib, requests, uuid
          requests.packages.urllib3.disable_warnings()

          cookie = os.getenv("MIHOYO_COOKIE")
          if not cookie:
              sys.exit(1)

          ACT_ID = "e202102251931481"
          SIGN_URL = "https://api-takumi.mihoyo.com/event/luna/sign"
          ROLE_URL = "https://api-takumi.mihoyo.com/binding/api/getUserGameRolesByCookie?game_biz=hk4e_cn"
          SALT = "t0qEgfub6cvueAPgR5m9aQWWVciEer7v"

          def get_ds():
              t = int(time.time())
              r = ''.join(random.choices("abcdefghijklmnopqrstuvwxyz0123456789", k=6))
              return f"{t},{r},{hashlib.md5(f'salt={SALT}&t={t}&r={r}'.encode()).hexdigest()}"

          def get_headers():
              return {
                  "Cookie": cookie,
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/135.0.0.0 Safari/537.36",
                  "Referer": f"https://webstatic.mihoyo.com/bbs/event/signin-ys/index.html?act_id={ACT_ID}",
                  "Origin": "https://webstatic.mihoyo.com",
                  "x-rpc-app_version": "2.73.1",
                  "x-rpc-client_type": "5",
                  "x-rpc-signgame": "hk4e",
                  "x-rpc-device_id": str(uuid.uuid4()),
                  "x-rpc-sign": get_ds(),
                  "Content-Type": "application/json"
              }

          roles = requests.get(ROLE_URL, headers=get_headers(), verify=False, timeout=10).json()
          if roles.get("retcode") != 0:
              sys.exit(1)

          for role in roles["data"]["list"]:
              payload = {"act_id": ACT_ID, "lang": "zh-cn", "region": role["region"], "uid": role["game_uid"]}
              res = requests.post(SIGN_URL, headers=get_headers(), json=payload, verify=False, timeout=10).json()
              print(res)
              time.sleep(2)
          EOF
