name: 米游社自动签到

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: pip install requests

      - name: 执行签到脚本
        env:
          MIHOYO_COOKIE: ${{ secrets.MIHOYO_COOKIE }}
        run: |
          python - <<END
          import os
          import requests

          cookie_str = os.environ.get("MIHOYO_COOKIE")
          if not cookie_str:
              print("❌ 错误：未配置Cookie")
              exit(1)

          cookies = cookie_str.split("&")
          print(f"共检测到 {len(cookies)} 个账号")

          for idx, cookie in enumerate(cookies, 1):
              print(f"\n===== 账号 {idx} =====")
              headers = {
                  "Cookie": cookie,
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
              }
              
              # 原神签到接口
              url = "https://api-takumi.mihoyo.com/event/bbs_sign_reward/sign"
              data = {"act_id": "e202009291139501", "lang": "zh-cn", "region": "cn_gf01", "uid": ""}
              
              try:
                  resp = requests.post(url, headers=headers, json=data)
                  result = resp.json()
                  if result.get("retcode") == 0:
                      print("✅ 原神签到成功：", result.get("message"))
                  elif result.get("retcode") == -5003:
                      print("ℹ️ 原神今日已签到，无需重复操作")
                  else:
                      print("❌ 原神签到失败：", result.get("message"))
              except Exception as e:
                  print("❌ 请求异常：", str(e))

          print("\n===== 所有账号签到任务结束 =====")
          END
