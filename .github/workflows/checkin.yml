name: 原神米游社自动签到
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装依赖
        run: pip install requests -q
      - name: 执行签到
        env:
          MIHOYO_COOKIE: ${{ secrets.MIHOYO_COOKIE }}
        run: |
          python - << 'EOF'
          import os
          import requests
          import uuid
          requests.packages.urllib3.disable_warnings()

          cookie = os.getenv("MIHOYO_COOKIE")
          if not cookie:
              print("❌ 未配置Cookie")
              exit()

          headers = {
              "Cookie": cookie,
              "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) miHoYoBBS/2.70.2",
              "x-rpc-device_id": str(uuid.uuid4()),
              "Referer": "https://www.miyoushe.com/"
          }

          # 2026最新米游社通用签到接口（无活动结束）
          def sign():
              url = "https://api-takumi.mihoyo.com/apichallenge/define/api/selfhelp/sign"
              data = {"app_id": "656"}
              res = requests.post(url, json=data, headers=headers, verify=False)
              return res.json()

          # 执行
          result = sign()
          code = result.get("retcode")
          
          if code == 0:
              print("✅ 原神米游社签到成功！")
          elif code == 1008:
              print("ℹ️ 今日已签到")
          elif code == -100:
              print("❌ Cookie已失效")
          else:
              print(f"ℹ️ {result.get('message', '未知结果')}")

          print("\n🎉 执行完成")
          EOF
